<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Check Calo Legal</title>
    <style>
      :root {
        color-scheme: light;
        --bg: #f6f9e8;
        --surface: #fffef8;
        --surface-alt: #f0f5d8;
        --text: #203214;
        --muted: #51633f;
        --border: #d9e6b2;
        --accent: #7ba120;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        font-family:
          Inter,
          -apple-system,
          BlinkMacSystemFont,
          'Segoe UI',
          sans-serif;
        background: linear-gradient(180deg, var(--bg), #eef4d5);
        color: var(--text);
        line-height: 1.6;
      }

      main {
        max-width: 760px;
        margin: 0 auto;
        padding: 48px 20px 72px;
      }

      .card {
        background: rgba(255, 254, 248, 0.92);
        border: 1px solid var(--border);
        border-radius: 24px;
        padding: 32px;
        box-shadow: 0 16px 40px rgba(32, 50, 20, 0.08);
      }

      h1 {
        margin: 0 0 12px;
        font-size: clamp(2rem, 4vw, 3rem);
        line-height: 1.2;
      }

      p {
        color: var(--muted);
        margin: 0 0 24px;
      }

      .links {
        display: grid;
        gap: 12px;
      }

      a {
        display: block;
        padding: 16px;
        border: 1px solid var(--border);
        border-radius: 16px;
        background: var(--surface-alt);
        color: var(--accent);
        font-weight: 700;
        text-decoration: none;
      }

      a:hover {
        text-decoration: underline;
      }
    </style>
  </head>
  <body>
    <main>
      <section class="card">
        <h1>Check Calo</h1>
        <p>Thông tin pháp lý và hỗ trợ người dùng.</p>

        <div class="links">
          <a href="./privacy-policy.html">Chính sách bảo mật</a>
          <a href="./account-deletion.html">Xoá tài khoản và dữ liệu</a>
        </div>
      </section>
    </main>
  </body>
</html>
